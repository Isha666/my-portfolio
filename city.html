<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>City After Dark | Isha</title>
 <link rel="stylesheet" href="city.css?v=portfolio-nav-1">
 <script type="module" src="city.js?v=frontend-credit-1"></script>
</head>
<body>
 <canvas id="cityView" aria-label="A glittery pastel-pink Porsche 911-style coupe on a neon waterfront boulevard"></canvas>
 <header class="city-header">
  <a class="city-brand" href="./?section=home" aria-label="Portfolio home">isha <span aria-hidden="true">✦</span></a>
  <nav class="city-nav" aria-label="Portfolio sections">
   <a href="./?section=home">Home</a>
   <a href="./?section=about">About</a>
   <a href="./?section=projects">Projects</a>
   <a href="./?section=skills">Skills</a>
   <a href="./city.html?from=reef" aria-current="page">Leadership and Achievements</a>
   <span class="city-nav-soon">Contact <small>soon</small></span>
  </nav>
  <button id="citySound" aria-pressed="false">Sound off</button>
 </header>
 <main>
  <section class="street-ui" aria-label="City drive">
   <div class="city-intro"><p>Leadership &amp; Achievements</p><h1>City After Dark</h1><span class="look-hint">Drag to look around</span></div>
   <label class="camera-picker">Camera
    <select id="cityCamera">
     <option value="chase">Chase</option>
     <option value="hood">Hood</option>
     <option value="skyline">Skyline</option>
     <option value="skypark">SkyPark towers</option>
     <option value="ring">Ring Hall</option>
     <option value="spires">Twin spires</option>
    </select>
   </label>
   <div class="drive">
    <div class="drive-status">
     <span id="driveHint">Drag to look around</span>
     <button id="pavilion" hidden>Look toward Waterfront Pavilion ↗</button>
     <button id="enterTower">Enter the Leadership Tower ↗</button>
    </div>
    <div class="drive-controls" role="group" aria-label="Driving controls">
     <button id="brake" class="city-pedal" type="button">Brake</button>
     <div class="drive-pad" role="group" aria-label="Directional controls">
      <button id="forward" aria-label="Drive forward">↑</button>
      <button id="laneLeft" aria-label="Switch to left lane">←</button>
      <button id="reverse" aria-label="Drive backward">↓</button>
      <button id="laneRight" aria-label="Switch to right lane">→</button>
     </div>
     <button id="accelerator" class="city-pedal" type="button">Accelerator</button>
    </div>
   </div>
  </section>
  <dialog id="tower" aria-labelledby="towerTitle">
   <div class="tower-nav"><span>Leadership Tower</span><button id="leaveTower">Return to car ↗</button></div>
   <div class="tower-body">
    <nav aria-label="Elevator floors"><span class="floor-label">ELEVATOR</span><div id="floorButtons"></div></nav>
    <div class="elevator-stage">
     <div class="floor-number" aria-hidden="true"><span id="floorDisplay">G</span><span>↑</span></div>
     <div id="floorArt" aria-hidden="true"></div>
     <div class="floor-copy" aria-live="polite"><p id="floorOrg">Waterfront district</p><h2 id="towerTitle">Take the elevator</h2><p id="floorStory">Choose a floor to explore a role.</p><button id="replayFloor" hidden>Replay animation</button></div>
     <div class="lift-doors" aria-hidden="true"><i></i><i></i></div>
    </div>
   </div>
  </dialog>
  <div class="lift-caption" role="status">Waterfront ascent</div>
 </main>
</body>
</html>
